# Resource naming prefix for ephemeral test resources
--resource_prefix=psm-connect

# Disable Workload Identity IAM policy binding (pre-configured on static clusters)
--noworkload_identity_iam_policy_binding

# Client VPC network hosting client container workloads
--network=psm-connect-client-vpc

# Server VPC network hosting server NEGs and backend services
--server_network=psm-connect-server-vpc

# Pre-provisioned Server PSC Service Attachment injected into ephemeral Mesh (forwardProxyServiceAttachments)
--forward_proxy_service_attachment=psm-connect-server-service-attachment

# Expected HTTP Connect proxy address and port for CSDS and Channelz assertions
--expected_http_connect_proxy=10.20.0.2:10002

--enable_http_connect

# allowMultinetwork on BackendService requires Compute v1alpha API
--compute_api_version=v1alpha
